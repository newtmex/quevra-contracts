[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
use_literal_content = true
# Monad permits deployed runtime bytecode up to 128 KiB.
code_size_limit = 131072
ignored_warnings_from = ["lib"]
lint = { exclude_lints = [
    # Intentional protocol patterns: bounded casts, controlled batch/precompile
    # calls, balance-based accounting, and event ordering around interactions.
    "arbitrary-send-eth",
    "calls-loop",
    "missing-events-access-control",
    "missing-events-arithmetic",
    "reentrancy-balance",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "unsafe-typecast",
] }
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
]
network = "monad"
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143
# Last cached Monad testnet fork on 2026-09-20; keep test forks reproducible.
fork_block_number = 64100294

[profile.e2e]
# The E2E runner overrides the fork block with Solonet's current block.
eth-rpc-url = "http://localhost:8080"
chain_id = 20143

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
